# ros_gz_bridge: topics de Gazebo -> ROS 2 con los nombres del V8.
# En el V8 cada plugin de Gazebo Classic publicaba directamente en ROS; en Gazebo Harmonic
# los sensores publican en Gazebo y este puente los pasa a ROS 2.

# El reloj de Gazebo (1 kHz) va a /pepper/clock_raw; clock_throttle lo publica en /clock a
# 100 Hz, como gazebo_ros en ROS 1 (pub_clock_frequency = 100).
- ros_topic_name: /pepper/clock_raw
  gz_topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: gz.msgs.Clock
  direction: GZ_TO_ROS

# --- Cámara frontal (CameraTop) ---
- ros_topic_name: /pepper/camera/front/image_raw
  gz_topic_name: /pepper/camera/front/image_raw
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
- ros_topic_name: /pepper/camera/front/camera_info
  gz_topic_name: /pepper/camera/front/camera_info
  ros_type_name: sensor_msgs/msg/CameraInfo
  gz_type_name: gz.msgs.CameraInfo
  direction: GZ_TO_ROS

# --- Cámara inferior (CameraBottom) ---
- ros_topic_name: /pepper/camera/bottom/image_raw
  gz_topic_name: /pepper/camera/bottom/image_raw
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
- ros_topic_name: /pepper/camera/bottom/camera_info
  gz_topic_name: /pepper/camera/bottom/camera_info
  ros_type_name: sensor_msgs/msg/CameraInfo
  gz_type_name: gz.msgs.CameraInfo
  direction: GZ_TO_ROS

# --- Cámara de profundidad (CameraDepth, rgbd_camera) ---
- ros_topic_name: /pepper/camera/ir/image_raw
  gz_topic_name: /pepper/camera/depth_sensor/image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
- ros_topic_name: /pepper/camera/depth/image_raw
  gz_topic_name: /pepper/camera/depth_sensor/depth_image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
# La nube de puntos NO se toma de Gazebo (usa ejes x-adelante, no los del frame óptico):
# la genera depth_image_proc desde depth/image_raw, como el plugin openni del V8.
- ros_topic_name: /pepper/camera/depth/camera_info
  gz_topic_name: /pepper/camera/depth_sensor/camera_info
  ros_type_name: sensor_msgs/msg/CameraInfo
  gz_type_name: gz.msgs.CameraInfo
  direction: GZ_TO_ROS

